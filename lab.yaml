# Lab-in-a-Box configuration.
# Authorized-use-only: this lab is for testing systems you own or have
# written permission to test. See README.md.
network: labnet

targets:
  dvwa:
    security_level: medium
    seed_user: labuser
    seed_pass: labpass123
    # Real brute tool for this target (see `brute:` below). Overrides the
    # global brute.tool. `tool_args` are appended to the tool command line.
    tool: ./tools/dvwa_brute.py
  ssh-lab:
    seed_user: labuser
    seed_pass: labpass123
  juice-shop:
    seed_user: labuser
    seed_pass: labpass123
    tool: ./tools/http_login_brute.py
    tool_args:
      - "--path=/rest/user/login"
      - "--user-field=email"
      - "--user-suffix=@lab.local"
  vuln-api:
    seed_user: labuser
    seed_pass: labpass123
    tool: ./tools/http_login_brute.py
    tool_args:
      - "--path=/api/login"
      - "--user-field=username"

brute:
  default_wordlist: ./wordlists/common.txt
  # The global default brute tool (used when a target has no `tool:` of its
  # own). The contract is documented in labctl/brute.py: the tool must accept
  # --host/--port/--usernames/--passwords/--threads/--delay/--timeout and
  # print `[+] user:pass` lines plus `[*] attempts=N confirmed=N ...`.
  # The tool runs under `brute.python` if set, else a sibling .venv/ next to
  # the tool (ssh_brute.py needs paramiko from its own venv), else the lab
  # venv. Override only when the tool's env lives elsewhere:
  #   python: /path/to/your/venv/bin/python
  # The in-tree ./tools/ssh_brute.py covers the ssh-lab target (which has no
  # per-target `tool:` above), so the global default is the SSH tool.
  tool: ./tools/ssh_brute.py
  usernames: ./wordlists/usernames.txt

# How long `labctl up` polls healthchecks before giving up.
boot_timeout_seconds: 300
